version: "3.9"

services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the pgvector extension
    # preinstalled (needed for document embeddings / RAG search).
    image: pgvector/pgvector:pg16
    container_name: meetinghub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetinghub
      POSTGRES_PASSWORD: meetinghub_dev_password
      POSTGRES_DB: meetinghub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinghub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: meetinghub-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://meetinghub:meetinghub_dev_password@postgres:5432/meetinghub
      AI_SERVICE_URL: http://host.docker.internal:8000
      # Cap the text sent to the AI service for embedding so a huge upload
      # can't hang the ingest request.
      DOCUMENT_TEXT_MAX_CHARS: "300000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - api_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ai-service now runs from the root venv on the host (see README), not Docker.
  # Uncomment this block if you'd rather containerize it again later.
  # ai-service:
  #   build:
  #     context: ./apps/ai-service
  #   container_name: meetinghub-ai-service
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_BASE_URL: http://host.docker.internal:11434
  #     OLLAMA_MODEL: llama3.2
  #     OLLAMA_EMBED_MODEL: nomic-embed-text
  #     DATABASE_URL: postgres://meetinghub:meetinghub_dev_password@postgres:5432/meetinghub
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./apps/ai-service:/app
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
    container_name: meetinghub-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  api_uploads:
